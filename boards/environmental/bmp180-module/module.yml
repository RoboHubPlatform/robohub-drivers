#
# bmp180-module — BMP180 temperature, pressure and altitude sensor breakout.
#
# @project RoboHub Platform
# @license MIT
#

module:
  name: bmp180-module
  type: driver-board
  version: 0.1.0
  description: >
    Support package for the Bosch BMP180 sensor breakout: which driver it
    carries, the signals its connector exposes, and the defaults its bus is
    reached with.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-13"

# The driver interfaces the part presents, mirrored from the driver's own
# manifest so the module can be found by function as well as by name.
functions:
  - temperature
  - pressure
  - altitude

build:
  language: c
  standard: c11
  include_dirs:
    - bsp/
  sources:
    - bsp/bsp.c

depends:
  - name: robohub-driver-bmp180
    type: c
    path: /home/miraur/projects/robohub-drivers/drivers/environmental/bmp180
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

exports:
  headers:
    - bsp/bmp180_module.h
  cmake:
    target: "rho::robohub-board-bmp180-module"
    include_dirs:
      - bsp
    link_libraries:
      - rho::robohub-driver-bmp180
      - rho::robohub-common

board:
  designation: BMP180_MODULE
  device: BMP180
  category: environmental
  driver: robohub-driver-bmp180
  functions:
    - temperature
    - pressure
    - altitude
  connector:
    - name: VCC
      signal: power
    - name: GND
      signal: ground
    - name: SDA
      signal: i2c_sda
    - name: SCL
      signal: i2c_scl
    - name: SDO
      signal: spi_sdo
    - name: CSB
      signal: spi_cs
  peripherals:
    i2c:
      - name: i2c0
        signal: SDA
    spi:
      - name: spi0
        signal: SDO
  defaults:
    transport: i2c
    address: 0x77
    oversampling: 0
    sea_level_pa: 101325

package:
  kind: library
  binary: false

metadata:
  tags:
    - board
    - eval
    - temperature
    - pressure
    - altitude
    - environmental
    - bmp180
  stability: experimental
  visibility: public
