#
# dht11-module — DHT11 temperature and humidity sensor breakout.
#
# @project RoboHub Platform
# @license MIT
#

module:
  name: dht11-module
  type: driver-board
  version: 0.1.0
  description: >
    Support package for the DHT11 temperature and humidity sensor breakout:
    which driver it carries, the signals its connector exposes, and the defaults
    its data line is reached with.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-13"

# The driver interfaces the part presents, mirrored from the driver's own
# manifest so the module can be found by function as well as by name.
functions:
  - temperature
  - humidity

build:
  language: c
  standard: c11
  include_dirs:
    - bsp/
  sources:
    - bsp/bsp.c

depends:
  - name: robohub-driver-dht11
    type: c
    path: /home/miraur/projects/robohub-drivers/drivers/environmental/dht11
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

exports:
  headers:
    - bsp/dht11_module.h
  cmake:
    target: "rho::robohub-board-dht11-module"
    include_dirs:
      - bsp
    link_libraries:
      - rho::robohub-driver-dht11
      - rho::robohub-common

board:
  designation: DHT11_MODULE
  device: DHT11
  category: environmental
  bus:
    type: gpio
    instance: dht0
  driver: robohub-driver-dht11
  functions:
    - temperature
    - humidity
  connectors:
    - name: vcc
      signal: power
      position: 1
    - name: gnd
      signal: ground
      position: 2
    - name: data
      signal: digital_io
      position: 3
  pins:
    vcc:
      signal: power
    gnd:
      signal: ground
    data:
      signal: digital_io
  peripherals:
    - name: dht0
      type: dht
      gpio: DATA
  defaults:
    min_interval_ms: 1000

package:
  kind: library
  binary: false

metadata:
  tags:
    - board
    - eval
    - temperature
    - humidity
    - environmental
    - dht11
    - air
  stability: experimental
  visibility: public
