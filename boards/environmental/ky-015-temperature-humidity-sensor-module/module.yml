module:
  name: ky-015-temperature-humidity-sensor-module
  type: driver-board
  version: 0.1.0
  description: >
    A KY-015 temperature and humidity sensor: a DHT11 on a single-wire bus.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-20"

functions:
  - temperature
  -  humidity

build:
  language: c
  standard: c11
  include_dirs:
    - bsp/
  sources:
    - bsp/bsp.c

depends:
  - name: robohub-driver-dht11
    type: c
    path: /home/miraur/projects/robohub-drivers/drivers/environmental/dht11
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

exports:
  headers:
    - bsp/ky_015_temperature_humidity_sensor_module.h
  cmake:
    target: "rho::robohub-board-ky-015-temperature-humidity-sensor-module"
    include_dirs:
      - bsp
    link_libraries:
      - rho::robohub-driver-dht11
      - rho::robohub-common

board:
  designation: KY_015_TEMPERATURE_HUMIDITY_SENSOR_MODULE
  device: ky-015-temperature-humidity-sensor
  category: environmental
  driver: robohub-driver-dht11
  functions:
    - temperature
    -  humidity
  connectors:
    - name: s
      signal: digital_io
      position: 1
    - name: vcc
      signal: power
      position: 2
    - name: gnd
      signal: ground
      position: 3
  pins:
    s:
      signal: digital_io
    vcc:
      signal: power
    gnd:
      signal: ground
  peripherals:
    - name: dht
      instance: dht
    - name: timer
      instance: timer

package:
  kind: library
  binary: false

metadata:
  tags:
    - board
    - eval
    - ky
    - environmental
  stability: experimental
  visibility: public
