module:
  name: ky-017-mercury-switch-module
  type: driver-board
  version: 0.1.0
  description: >
    A KY-017 mercury switch: a tilting contact on a GPIO.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-20"

functions:
  - button

build:
  language: c
  standard: c11
  include_dirs:
    - bsp/
  sources:
    - bsp/bsp.c

depends:
  - name: robohub-driver-button-gpio
    type: c
    path: /home/miraur/projects/robohub-drivers/drivers/input/button-gpio
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

exports:
  headers:
    - bsp/ky_017_mercury_switch_module.h
  cmake:
    target: "rho::robohub-board-ky-017-mercury-switch-module"
    include_dirs:
      - bsp
    link_libraries:
      - rho::robohub-driver-button-gpio
      - rho::robohub-common

board:
  designation: KY_017_MERCURY_SWITCH_MODULE
  device: ky-017-mercury-switch
  category: input
  driver: robohub-driver-button-gpio
  functions:
    - button
  connector:
    - name: VCC
      signal: power
    - name: GND
      signal: ground

package:
  kind: library
  binary: false

metadata:
  tags:
    - board
    - eval
    - ky
    - input
  stability: experimental
  visibility: public
