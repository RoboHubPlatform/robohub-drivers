module:
  name: ky-020-tilt-switch-module
  type: driver-board
  version: 0.1.0
  description: >
    A KY-020 tilt switch: a ball switch on a GPIO.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-20"

functions:
  - button

build:
  language: c
  standard: c11
  include_dirs:
    - bsp/
  sources:
    - bsp/bsp.c

depends:
  - name: robohub-driver-button-gpio
    type: c
    path: /home/miraur/projects/robohub-drivers/drivers/input/button-gpio
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

exports:
  headers:
    - bsp/ky_020_tilt_switch_module.h
  cmake:
    target: "rho::robohub-board-ky-020-tilt-switch-module"
    include_dirs:
      - bsp
    link_libraries:
      - rho::robohub-driver-button-gpio
      - rho::robohub-common

board:
  designation: KY_020_TILT_SWITCH_MODULE
  device: ky-020-tilt-switch
  category: input
  driver: robohub-driver-button-gpio
  functions:
    - button
  connectors:
    - name: vcc
      signal: power
      position: 1
    - name: gnd
      signal: ground
      position: 2
    - name: s
      signal: digital_in
      position: 3
  pins:
    vcc:
      signal: power
    gnd:
      signal: ground
    s:
      signal: digital_in
      active_low: true
  peripherals:
    - name: gpio
      instance: gpio

package:
  kind: library
  binary: false

metadata:
  tags:
    - board
    - eval
    - ky
    - input
  stability: experimental
  visibility: public
