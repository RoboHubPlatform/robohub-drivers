module:
  name: ky-022-infrared-receiver-module
  type: driver-board
  version: 0.1.0
  description: >
    A KY-022 infrared receiver: it hears the codes a remote sends.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-20"

functions:
  - infrared

build:
  language: c
  standard: c11
  include_dirs:
    - bsp/
  sources:
    - bsp/bsp.c

depends:
  - name: robohub-driver-infrared-receiver-gpio
    type: c
    path: /home/miraur/projects/robohub-drivers/drivers/input/infrared-receiver-gpio
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

exports:
  headers:
    - bsp/ky_022_infrared_receiver_module.h
  cmake:
    target: "rho::robohub-board-ky-022-infrared-receiver-module"
    include_dirs:
      - bsp
    link_libraries:
      - rho::robohub-driver-infrared-receiver-gpio
      - rho::robohub-common

board:
  designation: KY_022_INFRARED_RECEIVER_MODULE
  device: ky-022-infrared-receiver
  category: input
  driver: robohub-driver-infrared-receiver-gpio
  functions:
    - infrared
  connectors:
    - name: vcc
      signal: power
      position: 1
    - name: gnd
      signal: ground
      position: 2
    - name: out
      signal: digital_in
      position: 3
  pins:
    vcc:
      signal: power
    gnd:
      signal: ground
    out:
      signal: digital_in
  peripherals:
    - name: gpio
      instance: gpio
    - name: timer
      instance: timer

package:
  kind: library
  binary: false

metadata:
  tags:
    - board
    - eval
    - ky
    - input
  stability: experimental
  visibility: public
