module:
  name: ky-024-linear-magnetic-hall-module
  type: driver-board
  version: 0.1.0
  description: >
    A KY-024 linear magnetic hall sensor: the field it sees as a voltage.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-20"

functions:
  - analog

build:
  language: c
  standard: c11
  include_dirs:
    - bsp/
  sources:
    - bsp/bsp.c

depends:
  - name: robohub-driver-analog-adc
    type: c
    path: /home/miraur/projects/robohub-drivers/drivers/input/analog-adc
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

exports:
  headers:
    - bsp/ky_024_linear_magnetic_hall_module.h
  cmake:
    target: "rho::robohub-board-ky-024-linear-magnetic-hall-module"
    include_dirs:
      - bsp
    link_libraries:
      - rho::robohub-driver-analog-adc
      - rho::robohub-common

board:
  designation: KY_024_LINEAR_MAGNETIC_HALL_MODULE
  device: ky-024-linear-magnetic-hall
  category: input
  bus:
    type: adc
    instance: adc0
    channel: "0"
  driver: robohub-driver-analog-adc
  functions:
    - analog
  connectors:
    - name: vcc
      signal: power
      position: 1
    - name: gnd
      signal: ground
      position: 2
    - name: ao
      signal: analog_in
      position: 3
  pins:
    vcc:
      signal: power
    gnd:
      signal: ground
    ao:
      signal: analog_in
  peripherals:
    - name: adc
      instance: adc

package:
  kind: library
  binary: false

metadata:
  tags:
    - board
    - eval
    - ky
    - input
  stability: experimental
  visibility: public
