module:
  name: ky-025-reed-switch-module
  type: driver-board
  version: 0.1.0
  description: >
    A KY-025 reed switch: a digital contact and an analog output of the field strength.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-20"

functions:
  - analog
  -  button

build:
  language: c
  standard: c11
  include_dirs:
    - bsp/
  sources:
    - bsp/bsp.c

depends:
  - name: robohub-driver-analog-adc
    type: c
    path: /home/miraur/projects/robohub-drivers/drivers/input/analog-adc
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

exports:
  headers:
    - bsp/ky_025_reed_switch_module.h
  cmake:
    target: "rho::robohub-board-ky-025-reed-switch-module"
    include_dirs:
      - bsp
    link_libraries:
      - rho::robohub-driver-analog-adc
      - rho::robohub-common

board:
  designation: KY_025_REED_SWITCH_MODULE
  device: ky-025-reed-switch
  category: input
  driver: robohub-driver-analog-adc
  functions:
    - analog
    -  button
  connectors:
    - name: s
      signal: digital_in
      position: 1
    - name: vcc
      signal: power
      position: 2
    - name: gnd
      signal: ground
      position: 3
    - name: ao
      signal: analog_in
      position: 4
  pins:
    s:
      signal: digital_in
      active_low: true
    vcc:
      signal: power
    gnd:
      signal: ground
    ao:
      signal: analog_in
  peripherals:
    - name: adc
      instance: adc

package:
  kind: library
  binary: false

metadata:
  tags:
    - board
    - eval
    - ky
    - input
  stability: experimental
  visibility: public
