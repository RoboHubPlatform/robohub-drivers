module:
  name: ky-039-heartbeat-sensor-module
  type: driver-board
  version: 0.1.0
  description: >
    A KY-039 heartbeat sensor: a phototransistor that follows the pulse of blood.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-20"

functions:
  - pulse

build:
  language: c
  standard: c11
  include_dirs:
    - bsp/
  sources:
    - bsp/bsp.c

depends:
  - name: robohub-driver-pulse-adc
    type: c
    path: /home/miraur/projects/robohub-drivers/drivers/input/pulse-adc
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

exports:
  headers:
    - bsp/ky_039_heartbeat_sensor_module.h
  cmake:
    target: "rho::robohub-board-ky-039-heartbeat-sensor-module"
    include_dirs:
      - bsp
    link_libraries:
      - rho::robohub-driver-pulse-adc
      - rho::robohub-common

board:
  designation: KY_039_HEARTBEAT_SENSOR_MODULE
  device: ky-039-heartbeat-sensor
  category: input
  driver: robohub-driver-pulse-adc
  functions:
    - pulse
  connectors:
    - name: sig
      signal: analog_in
      position: 1
    - name: vcc
      signal: power
      position: 2
    - name: gnd
      signal: ground
      position: 3
  pins:
    sig:
      signal: analog_in
    vcc:
      signal: power
    gnd:
      signal: ground
  peripherals:
    - name: adc
      instance: adc
    - name: timer
      instance: timer

package:
  kind: library
  binary: false

metadata:
  tags:
    - board
    - eval
    - ky
    - input
  stability: experimental
  visibility: public
