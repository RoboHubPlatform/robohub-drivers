module:
  name: ky-018-photoresistor-module
  type: driver-board
  version: 0.1.0
  description: >
    A KY-018 photoresistor on an ADC channel.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-20"

functions:
  - light

build:
  language: c
  standard: c11
  include_dirs:
    - bsp/
  sources:
    - bsp/bsp.c

depends:
  - name: robohub-driver-photoresistor-adc
    type: c
    path: /home/miraur/projects/robohub-drivers/drivers/light/photoresistor-adc
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

exports:
  headers:
    - bsp/ky_018_photoresistor_module.h
  cmake:
    target: "rho::robohub-board-ky-018-photoresistor-module"
    include_dirs:
      - bsp
    link_libraries:
      - rho::robohub-driver-photoresistor-adc
      - rho::robohub-common

board:
  designation: KY_018_PHOTORESISTOR_MODULE
  device: ky-018-photoresistor
  category: light
  driver: robohub-driver-photoresistor-adc
  functions:
    - light
  connector:
    - name: VCC
      signal: power
    - name: GND
      signal: ground

package:
  kind: library
  binary: false

metadata:
  tags:
    - board
    - eval
    - ky
    - light
  stability: experimental
  visibility: public
