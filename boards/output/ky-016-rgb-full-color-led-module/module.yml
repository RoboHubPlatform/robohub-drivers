module:
  name: ky-016-rgb-full-color-led-module
  type: driver-board
  version: 0.1.0
  description: >
    A KY-016 RGB full-colour LED (SMD, four pins) on three PWM channels.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-20"

functions:
  - color

build:
  language: c
  standard: c11
  include_dirs:
    - bsp/
  sources:
    - bsp/bsp.c

depends:
  - name: robohub-driver-rgb-pwm
    type: c
    path: /home/miraur/projects/robohub-drivers/drivers/output/rgb-pwm
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

exports:
  headers:
    - bsp/ky_016_rgb_full_color_led_module.h
  cmake:
    target: "rho::robohub-board-ky-016-rgb-full-color-led-module"
    include_dirs:
      - bsp
    link_libraries:
      - rho::robohub-driver-rgb-pwm
      - rho::robohub-common

board:
  designation: KY_016_RGB_FULL_COLOR_LED_MODULE
  device: ky-016-rgb-full-color-led
  category: output
  driver: robohub-driver-rgb-pwm
  functions:
    - color
  connector:
    - name: VCC
      signal: power
    - name: GND
      signal: ground

package:
  kind: library
  binary: false

metadata:
  tags:
    - board
    - eval
    - ky
    - output
  stability: experimental
  visibility: public
