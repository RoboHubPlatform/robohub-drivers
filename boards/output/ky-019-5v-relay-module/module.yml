module:
  name: ky-019-5v-relay-module
  type: driver-board
  version: 0.1.0
  description: >
    A KY-019 5V relay: one channel that switches a load. It is active-HIGH — the relay pulls in when the signal is high, the opposite of the blue optocoupler boards.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-20"

functions:
  - switch

build:
  language: c
  standard: c11
  include_dirs:
    - bsp/
  sources:
    - bsp/bsp.c

depends:
  - name: robohub-driver-gpio-switch
    type: c
    path: /home/miraur/projects/robohub-drivers/drivers/output/gpio-switch
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

exports:
  headers:
    - bsp/ky_019_5v_relay_module.h
  cmake:
    target: "rho::robohub-board-ky-019-5v-relay-module"
    include_dirs:
      - bsp
    link_libraries:
      - rho::robohub-driver-gpio-switch
      - rho::robohub-common

board:
  designation: KY_019_5V_RELAY_MODULE
  device: ky-019-5v-relay
  category: output
  driver: robohub-driver-gpio-switch
  functions:
    - switch
  connectors:
    - name: s
      signal: digital_out
      position: 1
    - name: vcc
      signal: power
      position: 2
    - name: gnd
      signal: ground
      position: 3
    - name: nc
      signal: relay_nc
      position: 4
    - name: com
      signal: relay_com
      position: 5
    - name: no
      signal: relay_no
      position: 6
  pins:
    s:
      signal: digital_out
    vcc:
      signal: power
    gnd:
      signal: ground
    nc:
      signal: relay_nc
    com:
      signal: relay_com
    no:
      signal: relay_no
  peripherals:
    - name: gpio
      instance: gpio

package:
  kind: library
  binary: false

metadata:
  tags:
    - board
    - eval
    - ky
    - output
  stability: experimental
  visibility: public
