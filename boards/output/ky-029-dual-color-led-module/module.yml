module:
  name: ky-029-dual-color-led-module
  id: robohub.board.ky-029-dual-color-led-module
  previous_ids:
    - robohub-drivers.boards.output.ky-029-dual-color-led-module
  type: driver-board
  version: 0.1.0
  description: >
    A KY-029 dual-colour LED on two PWM channels.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-20"

functions:
  - color

build:
  language: c
  standard: c11
  include_dirs:
    - bsp/
  sources:
    - bsp/bsp.c

depends:
  - name: robohub-driver-rgb-pwm
    type: c
    path: ${ROBOHUB_WORKSPACE}/robohub-drivers/drivers/output/rgb-pwm
  - name: robohub-common
    type: c
    path: ${ROBOHUB_WORKSPACE}/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

exports:
  headers:
    - bsp/ky_029_dual_color_led_module.h
  cmake:
    target: "rho::robohub-board-ky-029-dual-color-led-module"
    include_dirs:
      - bsp
    link_libraries:
      - rho::robohub-driver-rgb-pwm
      - rho::robohub-common

board:
  designation: KY_029_DUAL_COLOR_LED_MODULE
  device: ky-029-dual-color-led
  category: output
  driver: robohub-driver-rgb-pwm
  functions:
    - color
  connectors:
    - name: vcc
      signal: power
    - name: gnd
      signal: ground
    # The red and green LEDs on two PWM channels (bsp: RED 0, GREEN 1, no blue).
    # The header's pin order is not recorded here, so no position is given.
    - name: r
      signal: pwm_out
    - name: g
      signal: pwm_out

package:
  kind: library
  binary: false

metadata:
  tags:
    - board
    - eval
    - ky
    - output
  stability: experimental
  visibility: public
