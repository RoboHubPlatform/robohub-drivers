#
# ds18b20-temperature-module — DS18B20 temperature sensor breakout support.
#
# @project RoboHub Platform
# @license MIT
#

module:
  name: ds18b20-temperature-module
  type: driver-board
  version: 0.1.0
  description: >
    Support package for the DS18B20 temperature sensor breakout: which driver it
    carries, the signals its connector exposes, and the defaults its data line
    is reached with.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-07"

# The driver interfaces the part presents, mirrored from the driver's own
# manifest so the module can be found by function as well as by name.
functions:
  - temperature

build:
  language: c
  standard: c11
  include_dirs:
    - bsp/
  sources:
    - bsp/bsp.c

depends:
  - name: robohub-driver-ds18b20
    type: c
    path: /home/miraur/projects/robohub-drivers/drivers/temperature/ds18b20
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

exports:
  headers:
    - bsp/ds18b20_temperature_module.h
  cmake:
    target: "rho::robohub-board-ds18b20-temperature-module"
    include_dirs:
      - bsp
    link_libraries:
      - rho::robohub-driver-ds18b20
      - rho::robohub-common

board:
  designation: DS18B20_MODULE
  device: DS18B20
  category: temperature
  bus:
    type: onewire
    instance: onewire0
  driver: robohub-driver-ds18b20
  functions:
    - temperature
  connectors:
    - name: vcc
      signal: power
      position: 1
    - name: gnd
      signal: ground
      position: 2
    - name: dq
      signal: onewire
      position: 3
  pins:
    vcc:
      signal: power
    gnd:
      signal: ground
    dq:
      signal: onewire
  peripherals:
    - name: onewire0
      type: onewire
      dq: DQ
  defaults:
    resolution_bits: 12
    alarm_high_c: 30
    alarm_low_c: 0

# What this module is, in the vocabulary a deployment planner reads: a sensor
# on the OneWire bus that measures temperature. The planner matches it to a
# board whose `capabilities.buses` include `onewire`.
capabilities:
  sensor: true
  summary: "DS18B20 1-Wire temperature sensor for ambient air."
  buses: "onewire"
  measures: "temperature"

# How a deployment uses this module. A module that can be fitted to a node
# names the example the keeper copies, the image it builds, and the Kconfig
# values that example needs. The keeper reads these at runtime, so a new driver
# is offered without rebuilding it.
deployment:
  boards: "pico2w"
  example: "examples/temperature/ds18b20/c/telemetry"
  binary: "build/output/telemetry.elf"
  kconfig: "CONFIG_RH_HAL_ONEWIRE=y CONFIG_RH_BOARD_DS18B20_MODULE=y CONFIG_RH_TRANSPORT=y CONFIG_RH_TELEMETRY=y CONFIG_RH_CONSOLE_USB=y"

package:
  kind: library
  binary: false

metadata:
  tags:
    - board
    - eval
    - temperature
    - ds18b20
    - air
  stability: experimental
  visibility: public
