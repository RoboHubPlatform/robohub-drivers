module:
  name: ky-013-analog-temperature-sensor-module
  type: driver-board
  version: 0.1.0
  description: >
    A KY-013 analog temperature sensor: a thermistor on an ADC channel.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-20"

functions:
  - temperature

build:
  language: c
  standard: c11
  include_dirs:
    - bsp/
  sources:
    - bsp/bsp.c

depends:
  - name: robohub-driver-thermistor-adc
    type: c
    path: /home/miraur/projects/robohub-drivers/drivers/temperature/thermistor-adc
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

exports:
  headers:
    - bsp/ky_013_analog_temperature_sensor_module.h
  cmake:
    target: "rho::robohub-board-ky-013-analog-temperature-sensor-module"
    include_dirs:
      - bsp
    link_libraries:
      - rho::robohub-driver-thermistor-adc
      - rho::robohub-common

board:
  designation: KY_013_ANALOG_TEMPERATURE_SENSOR_MODULE
  device: ky-013-analog-temperature-sensor
  category: temperature
  bus:
    type: adc
    instance: adc0
    channel: "0"
  driver: robohub-driver-thermistor-adc
  functions:
    - temperature
  connectors:
    - name: vcc
      signal: power
      position: 1
    - name: gnd
      signal: ground
      position: 2
    - name: ao
      signal: analog_in
      position: 3
  pins:
    vcc:
      signal: power
    gnd:
      signal: ground
    ao:
      signal: analog_in
  peripherals:
    - name: adc
      instance: adc

package:
  kind: library
  binary: false

metadata:
  tags:
    - board
    - eval
    - ky
    - temperature
    - air
  stability: experimental
  visibility: public
