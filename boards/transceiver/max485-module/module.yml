#
# max485-module — MAX485 RS485 transceiver carrier.
#
# @project RoboHub Platform
# @license MIT
#

module:
  name: max485-module
  type: driver-board
  version: 0.1.0
  description: >
    Support package for a MAX485 (or MAX3485, SN75176) RS485 transceiver
    carrier: it binds the UART the transceiver is wired to and the GPIO its
    direction pin is on into a RoboHubRS485, so a board without native RS485
    gets one by fitting the module.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-14"

build:
  language: c
  standard: c11
  include_dirs:
    - bsp/
  sources:
    - bsp/bsp.c

depends:
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

exports:
  headers:
    - bsp/max485_module.h
  cmake:
    target: "rho::robohub-board-max485-module"
    include_dirs:
      - bsp
    link_libraries:
      - rho::robohub-common

board:
  designation: MAX485_MODULE
  device: MAX485
  category: transceiver
  connectors:
    - name: vcc
      signal: power
      position: 1
    - name: gnd
      signal: ground
      position: 2
    - name: di
      signal: uart_tx
      position: 3
    - name: ro
      signal: uart_rx
      position: 4
    - name: de
      signal: gpio
      position: 5
    - name: re
      signal: gpio
      position: 6
    - name: a
      signal: rs485_a
      position: 7
    - name: b
      signal: rs485_b
      position: 8
  pins:
    vcc:
      signal: power
    gnd:
      signal: ground
    di:
      signal: uart_tx
    ro:
      signal: uart_rx
    de:
      signal: gpio
    re:
      signal: gpio
    a:
      signal: rs485_a
    b:
      signal: rs485_b
  peripherals:
    - name: uart1
      type: uart
      tx: DI
    - name: gpio0
      type: gpio
      gpio: DE
  defaults:
    uart: uart1
    de_pin: 20
    de_active_high: true
    baud: 9600

package:
  kind: library
  binary: false

metadata:
  tags:
    - board
    - transceiver
    - rs485
    - max485
    - modbus
  stability: experimental
  visibility: public
