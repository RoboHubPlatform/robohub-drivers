module:
  name: robohub-driver-gpio-switch
  type: driver
  version: 0.1.0
  description: >
    A output part for the RoboHub Platform, presenting the switch interface.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-20"

functions:
  - switch

build:
  language: c
  standard: c11
  include_dirs:
    - inc
  sources:
    - src/gpio_switch.c

depends:
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

exports:
  headers:
    - robohub/drivers/output/gpio_switch.h
  cmake:
    target: "rho::robohub-driver-gpio-switch"
    include_dirs:
      - inc
    link_libraries:
      - rho::robohub-common

package:
  kind: library
  binary: false

metadata:
  tags:
    - driver
    - output
    - gpio switch output
  stability: experimental
  visibility: public
