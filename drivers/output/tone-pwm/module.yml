module:
  name: robohub-driver-tone-pwm
  type: driver
  version: 0.1.0
  description: >
    A robohub-driver-tone-pwm part for the RoboHub Platform, presenting the tone interface.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-20"

functions:
  - tone

build:
  language: c
  standard: c11
  include_dirs:
    - inc
  sources:
    - src/tone_pwm.c

depends:
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

exports:
  headers:
    - robohub/drivers/output/tone_pwm.h
  cmake:
    target: "rho::robohub-driver-tone-pwm"
    include_dirs:
      - inc
    link_libraries:
      - rho::robohub-common

package:
  kind: library
  binary: false

metadata:
  tags:
    - output
    - tone
    - buzzer
    - pwm
    - driver
  stability: experimental
  visibility: public
