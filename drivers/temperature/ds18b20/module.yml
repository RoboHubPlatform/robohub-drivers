module:
  name: robohub-driver-ds18b20
  type: driver
  version: 0.1.0
  description: >
    Platform-agnostic DS18B20 1-Wire temperature sensor. Implements the
    RoboHubTemperature driver interface from robohub-common and reaches the part
    through the RoboHubOneWire and RoboHubTimer HAL interfaces, so it is not
    written for any one board.
  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-07"

# The driver interfaces this part presents. A DS18B20 is a temperature sensor
# and nothing else, so a search for a temperature sensor finds it.
functions:
  - temperature

build:
  language: c
  standard: c11
  include_dirs:
    - inc
  sources:
    - src/ds18b20.c

depends:
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

exports:
  # The name a consumer includes is the module's place in the ecosystem, not the
  # file's place in this directory. The header stays flat in inc/ds18b20.h; the
  # namespaced path is generated into the build tree and put on the path through
  # the CMake target below, and installed under this name.
  headers:
    - robohub/drivers/temperature/ds18b20.h
  cmake:
    target: "rho::robohub-driver-ds18b20"
    include_dirs:
      - inc
    link_libraries:
      - rho::robohub-common

package:
  kind: library
  binary: false

metadata:
  tags:
    - driver
    - temperature
    - onewire
    - ds18b20
  stability: experimental
  visibility: public
