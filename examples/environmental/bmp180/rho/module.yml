#
# bmp180/rho — reads the BMP180 module and prints temperature, pressure and
# altitude, in Rho.
#
# The same three readings as examples/environmental/bmp180/c, written in Rho. It
# is written against the board module's BSP, whose functions rho-cimport turns
# into the foreign interface imported as `ffi`.
#
# Built for the board with: rho build -target pico2w .
#
# @project RoboHub Platform
# @license MIT
#

module:
  name: bmp180-environmental-rho
  type: module
  version: 0.1.0
  description: >
    Reads the BMP180 breakout on a Pico 2W and prints the temperature, pressure
    and altitude over the console every 1.5 s, in Rho, through the board
    module's foreign interface.

  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-13"

main: src/main.rho

build:
  language: c
  output_dir: output
  presets:
    - pico2w

depends:
  - name: robohub-pico
    type: c
    path: /home/miraur/projects/robohub-pico
    git: https://github.com/RoboHubPlatform/robohub-pico
    branch: main
  - name: bmp180-module
    type: c
    path: /home/miraur/projects/robohub-drivers/boards/environmental/bmp180-module
  - name: robohub-driver-bmp180
    type: c
    path: /home/miraur/projects/robohub-drivers/drivers/environmental/bmp180

# The headers rho-cimport reads to write the foreign interface `ffi`. The board
# BSP is the whole of what this program calls; the driver and the bus come with
# it.
c_connection:
  library: "robohub-pico"
  headers:
    - platform.h
    - bmp180_module.h
    - bmp180.h
    - bus.h
    - registry.h
    - timer.h
    - error.h
    - types.h
  include_dirs:
    - /home/miraur/projects/robohub-pico/include
    - /home/miraur/projects/robohub-pico/include/robohub/hal
    - /home/miraur/projects/robohub-pico/include/robohub/platform
    - /home/miraur/projects/robohub-common/include
    - /home/miraur/projects/robohub-common/include/robohub/hal
    - /home/miraur/projects/robohub-common/include/robohub/drivers
    - /home/miraur/projects/robohub-drivers/drivers/environmental/bmp180/inc
    - /home/miraur/projects/robohub-drivers/boards/environmental/bmp180-module/bsp
  variants:
    pico2w:
      target: "robohub-board-bmp180-module"
      libraries:
        - robohub-driver-bmp180

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig
  values_file: project.conf

package:
  kind: library
  binary: false

metadata:
  tags:
    - example
    - environmental
    - bmp180
    - pico
  stability: experimental
  visibility: public
