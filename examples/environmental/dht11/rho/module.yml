#
# dht11/rho — reads the DHT11 module and prints temperature and humidity, in Rho.
#
# The same readings as examples/environmental/dht11/c, written in Rho. It is
# written against the board module's BSP, whose functions rho-cimport turns into
# the foreign interface imported as `ffi`.
#
# Built for the board with: rho build -target pico2w .
#
# @project RoboHub Platform
# @license MIT
#

module:
  name: dht11-environmental-rho
  type: module
  version: 0.1.0
  description: >
    Reads the DHT11 breakout on a Pico 2W and prints the temperature and
    humidity over the console every 2 s, in Rho, through the board module's
    foreign interface.

  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-13"

main: src/main.rho

build:
  language: c
  output_dir: output
  presets:
    - pico2w

depends:
  - name: robohub-pico
    type: c
    path: /home/miraur/projects/robohub-pico
    git: https://github.com/RoboHubPlatform/robohub-pico
    branch: main
  - name: dht11-module
    type: c
    path: /home/miraur/projects/robohub-drivers/boards/dht11-module
  - name: robohub-driver-dht11
    type: c
    path: /home/miraur/projects/robohub-drivers/drivers/environmental/dht11

# The headers rho-cimport reads to write the foreign interface `ffi`. The board
# BSP is the whole of what this program calls; the driver and the bus come with
# it.
c_connection:
  library: "robohub-pico"
  headers:
    - platform.h
    - bsp.h
    - dht11.h
    - dht.h
    - registry.h
    - timer.h
    - error.h
    - types.h
  include_dirs:
    - /home/miraur/projects/robohub-pico/include
    - /home/miraur/projects/robohub-pico/include/robohub/hal
    - /home/miraur/projects/robohub-pico/include/robohub/platform
    - /home/miraur/projects/robohub-common/include
    - /home/miraur/projects/robohub-common/include/robohub/hal
    - /home/miraur/projects/robohub-common/include/robohub/drivers
    - /home/miraur/projects/robohub-drivers/drivers/environmental/dht11/inc
    - /home/miraur/projects/robohub-drivers/boards/dht11-module/bsp
  variants:
    pico2w:
      target: "robohub-board-dht11-module"
      libraries:
        - robohub-driver-dht11

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig
  values_file: project.conf

package:
  kind: library
  binary: false

metadata:
  tags:
    - example
    - environmental
    - dht11
    - pico
  stability: experimental
  visibility: public
