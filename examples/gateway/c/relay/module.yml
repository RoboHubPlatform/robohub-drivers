#
# gateway/c/relay — a Pico that gateways without measuring.
#
# A pure hop: it carries each board's hello and sealed frames, unchanged, inside
# RELAYED sealed under its own session with its parent, and writes what the
# parent sends a board to the board's port. It holds no board's key and builds
# no reading of its own.
#
# Built for the board with: rho build -target pico2w .
#
# @project RoboHub Platform
# @license MIT
#

module:
  name: robohub-gateway-relay
  id: robohub.module.gateway-relay
  previous_ids:
    - robohub-drivers.examples.gateway.c.relay
  type: module
  version: 0.1.0
  description: >
    A gateway that only gateways: carries the boards on uart1 to its parent
    unchanged, their hellos and sealed frames inside RELAYED under its own
    session, and their sessions and commands back down. It holds no board's key
    and measures nothing of its own.

  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-13"

main: src/main.c

build:
  language: c
  sources:
    - src/main.c
    - src/uplink.c
    # The payloads, generated from schemas/gateway.rho. The same schemas generate
    # the gateway's Rho, so both ends write one layout; a relay speaks both
    # levels, so it generates both.
    - src/protocol/protocol.c
  output_dir: output
  presets:
    - pico2w

depends:
  - name: robohub-pico
    type: c
    path: ${ROBOHUB_WORKSPACE}/robohub-pico
    git: https://github.com/RoboHubPlatform/robohub-pico
    branch: main
  - name: robohub-core
    type: c
    path: ${ROBOHUB_WORKSPACE}/robohub-node/core
  - name: robohub-transport
    type: c
    path: ${ROBOHUB_WORKSPACE}/robohub-node/link
  - name: robohub-telemetry
    type: c
    path: ${ROBOHUB_WORKSPACE}/robohub-node/telemetry

c_connection:
  library: "robohub-pico"
  # The headers are what make the upload record the preset's board sources.
  headers:
    - platform.h
    - console.h
    - gpio.h
    - timer.h
    - uart.h
    - error.h
    - types.h
    - registry.h
  include_dirs:
    - ${ROBOHUB_WORKSPACE}/robohub-drivers/examples/gateway/c/relay/src/protocol
    - ${ROBOHUB_WORKSPACE}/robohub-common/include
    - ${ROBOHUB_WORKSPACE}/robohub-common/include/robohub/hal
    - ${ROBOHUB_WORKSPACE}/robohub-common/include/robohub/drivers
    - ${ROBOHUB_WORKSPACE}/robohub-pico/include
    - ${ROBOHUB_WORKSPACE}/robohub-pico/include/robohub/hal
    - ${ROBOHUB_WORKSPACE}/robohub-pico/include/robohub/platform
    - ${ROBOHUB_WORKSPACE}/robohub-node/core/include
    - ${ROBOHUB_WORKSPACE}/robohub-node/core/include/robohub/core
    - ${ROBOHUB_WORKSPACE}/robohub-node/link/include
    - ${ROBOHUB_WORKSPACE}/robohub-node/telemetry/include
  variants:
    pico2w:
      libraries:
        - robohub-core
        - robohub-transport
        - robohub-telemetry

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig
  values_file: project.conf

package:
  kind: library
  binary: false

metadata:
  tags:
    - example
    - gateway
    - relay
    - pico
    - telemetry
    - transport
  stability: experimental
  visibility: public
