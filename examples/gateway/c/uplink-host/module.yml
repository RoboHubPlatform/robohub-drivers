#
# gateway/c/uplink-host — a relay's uplink, on a host.
#
# The gateway-only mode of a relay, built for robohub-linux rather than a board:
# it dials the gateway above it, announces the area it speaks for, and sends a
# reading up. The smallest program that exercises the uplink end to end, and the
# one that runs where there is no board.
#
#     rho build -target native .
#
# @project RoboHub Platform
# @license MIT
#

module:
  name: robohub-gateway-uplink-host
  type: module
  version: 0.1.0
  description: >
    A relay's uplink on a host: connects to the gateway above, announces the area
    it speaks for, and re-frames a reading into the uplink's shape. Runs on
    robohub-linux, so the gateway-only mode needs no board.

  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-13"

main: src/main.c

build:
  language: c
  standard: c11
  sources:
    - src/main.c
    - src/uplink.c
    - src/protocol/protocol.c
  output_dir: output
  presets:
    - native

depends:
  - name: robohub-linux
    type: c
    path: /home/miraur/projects/robohub-linux
    git: https://github.com/RoboHubPlatform/robohub-linux
    branch: main
  - name: robohub-transport
    type: c
    path: /home/miraur/projects/robohub-transport
    git: https://github.com/RoboHubPlatform/robohub-transport
    branch: main
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

c_connection:
  library: "robohub-linux"
  headers:
    - platform.h
    - robohub/net.h
  include_dirs:
    - /home/miraur/projects/robohub-drivers/examples/gateway/c/uplink-host/src/protocol
    - /home/miraur/projects/robohub-linux/include
    - /home/miraur/projects/robohub-common/include
    - /home/miraur/projects/robohub-common/include/robohub/hal
    - /home/miraur/projects/robohub-core/include
    - /home/miraur/projects/robohub-core/include/robohub/core
    - /home/miraur/projects/robohub-transport/include
  variants:
    native:
      libraries:
        - robohub-transport
        - robohub-common

config:
  dialect: linux
  values_file: project.conf

package:
  kind: library
  binary: false

metadata:
  tags:
    - example
    - gateway
    - uplink
    - linux
    - host
  stability: experimental
  visibility: public
