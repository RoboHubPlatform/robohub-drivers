#
# @file module.yml
# @brief robohub-drivers — the drivers, and how one is started.
#
# The repository is a collection rather than one library, so this manifest
# describes the collection and what a person may start from it. `rho init` in
# this directory reads `generate:` and writes a driver and the example that uses
# it, instead of a Rho application, because that is what this repository is for.
#
# @project RoboHub Platform
# @license MIT
#

module:
  name: robohub-drivers
  type: collection
  version: 0.2.3
  description: >
    Device drivers for the RoboHub Platform, and the examples that use them.

# The functions a driver here may present, one per driver interface
# robohub-common declares. A driver lists the ones it answers in its own
# manifest, so a sensor that measures more than one thing — a BMP180 is a
# thermometer, a barometer and an altimeter at once — is found by any of them.
# This is the vocabulary; a driver's own `functions:` is its claim.
functions:
  - temperature
  - pressure
  - altitude
  - humidity
  - button
  - light
  - tone
  - color
  - infrared
  - analog
  - encoder
  - pulse

# The contract a board manifest is written to.
#
# A board is a module of type driver-board, at boards/<category>/<name>/module.yml.
# The tree is the index: Mesh and the orchestrator discover boards by walking it,
# so a board added here is available without a list elsewhere being edited.
contracts:
  board:
    discovery: "boards/*/*/module.yml"
    description: >
      One board in one folder, with its support package beside its manifest.
      The folder name is the board's module name; the category is the folder
      above it and is the section the Mesh module picker groups by.
    requires:
      module:
        - name
        - type
        - version
        - description
      board:
        - designation
        - device
        - category
        - driver
        - connectors
      capabilities:
        - sensor
        - summary
        - buses
        - measures
      metadata:
        - tags
    bus:
      description: >
        How the board reaches a node. A missing block is a module that makes no
        claim about its bus; the Mesh bus plan says so rather than guessing.
      fields:
        type: "onewire, i2c, spi, adc, pwm, gpio or uart"
        instance: "the bus or peripheral instance, such as i2c0"
        address: "an I2C address a fixed part answers on"
        addresses: "an I2C address range a configurable part can be set to"
        cs: "an SPI chip select, or auto for the node to choose one"
        channel: "an ADC or PWM channel"
    media_tags:
      description: >
        A board rated for a medium carries the tag in metadata.tags so a water,
        garden or air application can find it.
      values:
        - water
        - dirt
        - air
    exports:
      description: >
        The CMake target and public includes a node links the board with. A
        board whose target is already the example's own target is not linked a
        second time.
      fields:
        - headers
        - cmake.target
        - cmake.include_dirs
        - cmake.link_libraries

# What `rho init` can write here. Inline for a repository this small; a larger
# one points at a generate.yml it keeps beside its sources.
generate:
  - name: driver
    description: A new device driver, the eval board that carries it, and the example that uses it
    variables:
      - name: category
        description: The category the driver belongs to, such as temperature
      - name: name
        description: The device, such as ds18b20
      - name: functions
        description: Comma-separated driver interfaces it presents, such as temperature,pressure
    outputs:
      - path: drivers/{{category}}/{{name}}
        template: templates/driver
      # A board sits under the same category as the driver it carries, so the
      # three trees — drivers, boards, examples — are indexed the same way.
      - path: boards/{{category}}/{{name}}-module
        template: templates/board
      - path: examples/{{category}}/{{name}}/c
        template: templates/example

docs:
  title: RoboHub Drivers
  section: collections
  order: "20"
  index: docs/index.md
  sources:
    - docs/index.md
