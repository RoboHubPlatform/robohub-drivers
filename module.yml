#
# @file module.yml
# @brief robohub-drivers — the drivers, and how one is started.
#
# The repository is a collection rather than one library, so this manifest
# describes the collection and what a person may start from it. `rho init` in
# this directory reads `generate:` and writes a driver and the example that uses
# it, instead of a Rho application, because that is what this repository is for.
#
# @project RoboHub Platform
# @license MIT
#

module:
  name: robohub-drivers
  type: collection
  version: 0.1.0
  description: >
    Device drivers for the RoboHub Platform, and the examples that use them.

# The functions a driver here may present, one per driver interface
# robohub-common declares. A driver lists the ones it answers in its own
# manifest, so a sensor that measures more than one thing — a BMP180 is a
# thermometer, a barometer and an altimeter at once — is found by any of them.
# This is the vocabulary; a driver's own `functions:` is its claim.
functions:
  - temperature
  - pressure
  - altitude
  - humidity
  - button
  - light
  - tone
  - color
  - infrared
  - analog
  - encoder
  - pulse

# What `rho init` can write here. Inline for a repository this small; a larger
# one points at a generate.yml it keeps beside its sources.
generate:
  - name: driver
    description: A new device driver, the eval board that carries it, and the example that uses it
    variables:
      - name: category
        description: The category the driver belongs to, such as temperature
      - name: name
        description: The device, such as ds18b20
      - name: functions
        description: Comma-separated driver interfaces it presents, such as temperature,pressure
    outputs:
      - path: drivers/{{category}}/{{name}}
        template: templates/driver
      # A board sits under the same category as the driver it carries, so the
      # three trees — drivers, boards, examples — are indexed the same way.
      - path: boards/{{category}}/{{name}}-module
        template: templates/board
      - path: examples/{{category}}/{{name}}/c
        template: templates/example
