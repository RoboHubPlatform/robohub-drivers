module:
  name: {{name}}-module
  type: driver-board
  version: 0.1.0
  description: >
    {{description}}

  maintainer: "Aurel Miron"
  license: "MIT"
  created: "2026-10-20"

# The driver interfaces the part presents, mirrored from the driver's own
# manifest so the board is found by function as well as by name.
functions: [{{functions}}]

build:
  language: c
  standard: c11
  include_dirs:
    - bsp/
  sources:
    - bsp/bsp.c

depends:
  - name: robohub-driver-{{name}}
    type: c
    path: /home/miraur/projects/robohub-drivers/drivers/{{category}}/{{name}}
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

exports:
  headers:
    - bsp/{{name}}_module.h
  cmake:
    target: "rho::robohub-board-{{name}}-module"
    include_dirs:
      - bsp
    link_libraries:
      - rho::robohub-driver-{{name}}
      - rho::robohub-common

board:
  designation: {{name}}_MODULE
  device: {{name}}
  category: {{category}}
  driver: robohub-driver-{{name}}
  functions: [{{functions}}]
  connector:
    - name: VCC
      signal: power
    - name: GND
      signal: ground
  peripherals: {}

package:
  kind: library
  binary: false

metadata:
  tags:
    - board
    - eval
    - {{category}}
  stability: experimental
  visibility: public
