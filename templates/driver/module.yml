module:
  name: robohub-driver-{{name}}
  type: driver
  version: 0.1.0
  description: >
    {{description}}

# The driver interfaces this part presents. Declare every one the driver
# implements — a part that measures more than one thing lists each, so a search
# for any of them finds it. The names are the vocabulary the collection's own
# manifest declares.
functions: [{{functions}}]

build:
  language: c
  standard: c11
  include_dirs:
    - inc
  sources:
    - src/{{name}}.c

depends:
  - name: robohub-common
    type: c
    path: /home/miraur/projects/robohub-common
    git: https://github.com/RoboHubPlatform/robohub-common
    branch: main

config:
  dialect: linux
  kconfig_fragments:
    - Kconfig

exports:
  headers:
    - robohub/drivers/{{category}}/{{name}}.h
